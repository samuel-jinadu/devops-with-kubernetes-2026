apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greeter-route
  namespace: default
spec:
  parentRefs:
    - name: exercises-gateway
      namespace: exercises
  hostnames:                    # <-- add
    - localhost
    - "*.sslip.io"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /greeter }
      filters:
        - type: URLRewrite
          urlRewrite:
            path: { type: ReplacePrefixMatch, replacePrefixMatch: / }
      backendRefs:
        - { name: greeter-svc-1, port: 8080, weight: 75 }
        - { name: greeter-svc-2, port: 8080, weight: 25 }