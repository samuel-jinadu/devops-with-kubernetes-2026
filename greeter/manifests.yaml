# --- Version 1 Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-v1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
        - name: greeter
          image: ghcr.io/samuel-jinadu/greeter:main # <-- GHCR Image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GREETING
              value: "Hello from version 1"

---
# --- Version 2 Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-v2
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v2
  template:
    metadata:
      labels:
        app: greeter
        version: v2
    spec:
      containers:
        - name: greeter
          image: ghcr.io/samuel-jinadu/greeter:main # <-- GHCR Image
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GREETING
              value: "Hello from version 2"

---
# --- Service 1 (Targets v1) ---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-1
  namespace: default
spec:
  selector:
    app: greeter
    version: v1
  ports:
    - port: 8080
      targetPort: 8080

---
# --- Service 2 (Targets v2) ---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-2
  namespace: default
spec:
  selector:
    app: greeter
    version: v2
  ports:
    - port: 8080
      targetPort: 8080

---
# --- Main Service (ParentRef for HTTPRoute) ---
apiVersion: v1
kind: Service
metadata:
  name: greeter-svc
  namespace: default
spec:
  selector:
    app: greeter
  ports:
    - port: 8080
      targetPort: 8080

---
# --- HTTPRoute for Traffic Splitting ---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: greeter-route
  namespace: default
spec:
  parentRefs:
    - name: greeter-svc
      kind: Service
      port: 8080
  rules:
    - backendRefs:
        - name: greeter-svc-1
          port: 8080
          weight: 75
        - name: greeter-svc-2
          port: 8080
          weight: 25