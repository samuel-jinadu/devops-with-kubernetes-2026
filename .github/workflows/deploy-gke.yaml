name: Deploy to GKE

on:
  workflow_run:
    workflows: ["Publish image to GHCR"]
    types: [completed]
    # NOTE: no `branches:` filter — deploy every branch.
    # Tag pushes also trigger (head_branch will be empty; mapped to project/:main).

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-gke-${{ github.event.workflow_run.head_branch || 'default' }}
  cancel-in-progress: false

jobs:
  deploy:
    # GATE 1 — repo variable (unset = run) + publish success
    if: |
      vars.DISABLE_GKE_DEPLOY != 'true' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Compute deployment target from the branch/tag that triggered publish
      - name: Compute deployment target
        id: target
        run: |
          REF="${{ github.event.workflow_run.head_branch }}"
          if [ -z "$REF" ] || [ "$REF" = "main" ]; then
            # Empty (tag push) or main → project namespace, :main image
            NS="project"
            TAG="main"
          elif [[ "$REF" =~ ^v[0-9] ]]; then
            # Semver-ish tag → deploy tagged image into project (release-style)
            NS="project"
            TAG="$REF"
          else
            # Branch → its own namespace, tag = branch name
            NS="$REF"
            TAG="$REF"
          fi
          echo "ns=$NS"   >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Deploying to ns=$NS with tag=$TAG"

      # GATE 2 — skip body but stay green if no GCP creds
      - name: Check GCP credentials
        id: gcp
        run: |
          if [ -z "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || \
             [ -z "${{ secrets.GCP_SERVICE_ACCOUNT }}" ]; then
            echo "::notice::No GCP credentials configured — deploy skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gcp.outputs.skip == 'false'

      - name: Authenticate to Google Cloud
        if: steps.gcp.outputs.skip == 'false'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:           ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.gcp.outputs.skip == 'false'
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        if: steps.gcp.outputs.skip == 'false'
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: dwk-cluster
          location:     europe-north1-b

      - name: Install sops
        if: steps.gcp.outputs.skip == 'false'
        run: |
          VER=$(curl -s https://api.github.com/repos/getsops/sops/releases/latest | grep tag_name | cut -d'"' -f4)
          curl -sL "https://github.com/getsops/sops/releases/download/${VER}/sops_${VER#v}_amd64.deb" -o /tmp/sops.deb
          sudo dpkg -i /tmp/sops.deb

      - name: Deploy
        if: steps.gcp.outputs.skip == 'false'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          TARGET_NS:    ${{ steps.target.outputs.ns }}
          TARGET_TAG:   ${{ steps.target.outputs.tag }}
        run: |
          chmod +x deploy-gke.sh
          ./deploy-gke.sh