name: Emulator Smoke Test

on:
  workflow_run:
    workflows: ["Publish image to GHCR"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: emulator-smoke-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: |
      vars.ENABLE_EMULATOR_SMOKE_TEST == 'true' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDSDK_API_ENDPOINT_OVERRIDES_CONTAINER: http://localhost:4588/container/
      CLOUDSDK_API_ENDPOINT_OVERRIDES_SERVICEUSAGE: http://localhost:4588/
      CLOUDSDK_CORE_PROJECT: floci-local
      CLOUDSDK_AUTH_ACCESS_TOKEN: floci
      GATEWAY_PORT: "8060"
    steps:
      - uses: actions/checkout@v4

      - name: Verify SOPS_AGE_KEY is available
        run: |
          if [ -z "${{ secrets.SOPS_AGE_KEY }}" ]; then
            echo "::error::SOPS_AGE_KEY secret missing — cannot decrypt secrets"
            exit 1
          fi

      - name: Install tools
        run: |
          curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
            | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list
          curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          sudo apt-get update -qq
          sudo apt-get install -y google-cloud-cli google-cloud-cli-gke-gcloud-auth-plugin openssl
          VER=$(curl -s https://api.github.com/repos/getsops/sops/releases/latest | grep tag_name | cut -d'"' -f4)
          curl -sL "https://github.com/getsops/sops/releases/download/${VER}/sops_${VER#v}_amd64.deb" -o /tmp/sops.deb
          sudo dpkg -i /tmp/sops.deb

      - name: Start floci-gcp emulator
        run: |
          docker rm -f floci-gcp 2>/dev/null || true
          docker run -d --name floci-gcp --restart unless-stopped \
            -p 4588:4588 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            floci/floci-gcp:latest
          for i in $(seq 1 60); do
            if docker logs floci-gcp 2>&1 | grep -q "floci-gcp Ready"; then
              echo "emulator process ready"
              sleep 3
              exit 0
            fi
            sleep 2
          done
          echo "::error::emulator failed to reach Ready state"
          docker logs floci-gcp
          exit 1

      - name: Wait for emulator Container API
        run: |
          for i in $(seq 1 30); do
            if gcloud container clusters list --zone=europe-north1-b >/dev/null 2>&1; then
              echo "emulator Container API ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::emulator Container API not responding"
          docker logs floci-gcp --tail 100
          exit 1

      - name: Fabricate valid-structure key.json for emulator
        run: |
          PRIV=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null \
                 | sed ':a;N;$!ba;s/\n/\\n/g')
          cat > key.json <<EOF
          {
            "type": "service_account",
            "project_id": "floci-local",
            "private_key_id": "stub-for-emulator-only",
            "private_key": "${PRIV}",
            "client_email": "my-storage-sa@floci-local.iam.gserviceaccount.com",
            "client_id": "stub",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token",
            "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs"
          }
          EOF
          python3 -c "import json; json.load(open('key.json'))"
          echo "wrote key.json ($(wc -c < key.json) bytes)"

      # ─── Phase 1: deploy staging (default) ────────────────────────────────────
      - name: Deploy staging (Argo CD via main)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GITOPS_REPO_URL: https://github.com/${{ github.repository }}.git
          GITOPS_REVISION: main
        run: |
          chmod +x deploy-gke.sh
          ./deploy-gke.sh

      - name: Assert staging — exercises endpoints still served
        run: |
          set -euo pipefail
          if ! curl -fsS --max-time 2 "http://localhost:${GATEWAY_PORT}/pingpong" >/dev/null 2>&1; then
            ENVOY_SVC=$(kubectl -n envoy-gateway-system get svc \
              -l gateway.envoyproxy.io/owning-gateway-name=exercises-gateway \
              -o jsonpath='{.items[0].metadata.name}')
            pkill -f "kubectl.*port-forward.*${ENVOY_SVC}" 2>/dev/null || true
            sleep 1
            nohup kubectl -n envoy-gateway-system port-forward svc/"${ENVOY_SVC}" "${GATEWAY_PORT}:80" \
              >/tmp/envoy-test-pf.log 2>&1 &
            for i in $(seq 1 20); do
              curl -fsS --max-time 2 "http://localhost:${GATEWAY_PORT}/pingpong" >/dev/null 2>&1 && break
              sleep 1
            done
          fi
          BASE="http://localhost:${GATEWAY_PORT}"
          curl -fsS "${BASE}/pingpong" | grep -q pong
          curl -fsS "${BASE}/log"      | grep -q "hello world"
          echo "✅ exercises namespace endpoints OK"

      - name: Deploy and Assert Wikipedia App (Init & Sidecar)
        run: |
          set -euo pipefail

          echo "▶ Deploying Wikipedia app..."
          kubectl apply -f wikipedia-app/deployment.yaml

          echo "▶ Waiting for pod to be ready (Init container runs first)..."
          kubectl wait --for=condition=Ready pod -l app=wikipedia -n exercises --timeout=120s

          # 1. Verify the Init Container
          echo "▶ Verifying Init container content..."
          kubectl port-forward deployment/wikipedia-app 8081:80 -n exercises >/dev/null 2>&1 &
          PF_PID=$!

          # NOTE: deliberately NOT `curl ... | grep -q`. `grep -q` exits as soon as it
          # matches, which sends SIGPIPE to curl while it is still writing this ~600 KB
          # page; combined with `set -o pipefail` that pipeline reports 141 even though
          # the content is correct. Download first, grep the file.
          INIT_OK=0
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081 -o /tmp/wiki-init.html; then
              if grep -qi "Kubernetes" /tmp/wiki-init.html; then
                echo "✅ Init container successfully served the Kubernetes page."
                INIT_OK=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$INIT_OK" -ne 1 ]; then
            echo "❌ Init container failed to serve the Kubernetes page."
            curl -sv http://localhost:8081 || true
            kill $PF_PID 2>/dev/null || true
            exit 1
          fi

          # 2. Patch the sidecar for fast testing
          echo "▶ Patching sidecar to sleep for only 2 seconds..."
          kubectl patch deployment wikipedia-app -n exercises --type='json' -p='[{"op": "replace", "path": "/spec/template/spec/containers/1/command/2", "value": "while true; do SLEEP_TIME=2; echo \"Sleeping for $SLEEP_TIME seconds...\"; sleep $SLEEP_TIME; echo \"Fetching random Wikipedia page...\"; curl -sL -o /usr/share/nginx/html/index.html https://en.wikipedia.org/wiki/Special:Random; echo \"Page updated!\"; done"}]'

          kubectl rollout status deployment/wikipedia-app -n exercises --timeout=120s

          # 3. Verify the Sidecar updates the content
          echo "▶ Waiting for sidecar to update the page..."
          kill $PF_PID 2>/dev/null || true
          sleep 1

          kubectl port-forward deployment/wikipedia-app 8081:80 -n exercises >/dev/null 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          SIDECAR_OK=0
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8081 -o /tmp/wiki-current.html; then
              # Compare files (no pipe → no SIGPIPE) and confirm the payload is
              # actually a Wikipedia page.
              if ! cmp -s /tmp/wiki-init.html /tmp/wiki-current.html && grep -qi "Wikipedia" /tmp/wiki-current.html; then
                echo "✅ Sidecar successfully fetched and served a random Wikipedia page."
                SIDECAR_OK=1
                break
              fi
            fi
            sleep 2
          done
          if [ "$SIDECAR_OK" -ne 1 ]; then
            echo "❌ Sidecar did not update the page."
            kubectl logs deployment/wikipedia-app -c sidecar-fetch -n exercises --tail=20 || true
            exit 1
          fi

          echo "🎉 Wikipedia app (Init + Sidecar) verification passed!"

          # 4. Cleanup
          kubectl delete deployment wikipedia-app -n exercises --ignore-not-found

      - name: Deploy and Assert Greeter Traffic Splitting (75/25)
        run: |
          set -euo pipefail
          
          # 1. Apply the Greeter manifests
          kubectl apply -f greeter/manifests.yaml
          
          # 2. Wait for the Greeter deployments to be ready
          kubectl wait --for=condition=Ready pod -l app=greeter,version=v1 --timeout=120s
          kubectl wait --for=condition=Ready pod -l app=greeter,version=v2 --timeout=120s
          
          echo "▶ Firing 20 requests to the Gateway /greeter route..."
          V1_COUNT=0
          V2_COUNT=0
          
          # 3. Hit the Gateway 20 times (GATEWAY_PORT is already set to 8060 in CI env)
          for i in $(seq 1 20); do
            RESPONSE=$(curl -s "http://localhost:${GATEWAY_PORT}/greeter")
            echo "Request $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q "version 1"; then
              V1_COUNT=$((V1_COUNT+1))
            elif echo "$RESPONSE" | grep -q "version 2"; then
              V2_COUNT=$((V2_COUNT+1))
            fi
          done
          
          echo "📊 Results: V1=$V1_COUNT, V2=$V2_COUNT"
          
          # 4. Assert the split (Expected ~15 for V1, ~5 for V2. Allowing margin of error for 20 samples)
          if [ "$V1_COUNT" -lt 10 ] || [ "$V1_COUNT" -gt 19 ]; then
            echo "❌ Traffic split failed: Expected roughly 15 requests to V1, got $V1_COUNT"
            exit 1
          fi
          if [ "$V2_COUNT" -lt 1 ] || [ "$V2_COUNT" -gt 10 ]; then
            echo "❌ Traffic split failed: Expected roughly 5 requests to V2, got $V2_COUNT"
            exit 1
          fi
          
          echo "✅ Traffic splitting successfully verified!"

      - name: Assert staging — no backup CronJob
        run: |
          set -euo pipefail
          if kubectl -n staging get cronjob backup-todo-db-cronjob >/dev/null 2>&1; then
            echo "::error::staging has a backup CronJob — exercise 4.9 says staging must NOT back up"
            kubectl -n staging get cronjobs
            exit 1
          fi
          echo "✅ staging has no backup CronJob (as required)"

      - name: Assert staging — broadcaster runs in LOG_ONLY mode
        run: |
          set -euo pipefail
          # PORT_FORWARD not available for staging's todo-app (no HTTPRoute)
          # so fire a todo via port-forward to staging's todo-backend service
          kubectl -n staging port-forward svc/todo-backend-service-cluster-ip 18090:2345 \
            >/tmp/staging-backend-pf.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            curl -fsS --max-time 2 http://localhost:18090/ >/dev/null 2>&1 && break
            sleep 1
          done

          TODO="staging-log-only-$(date +%s)"
          curl -fsS -X POST --data-urlencode "todo=${TODO}" \
            "http://localhost:18090/submit" -o /dev/null

          # broadcaster log_loop is 5s-cadence, so wait up to 15s
          ok=0
          for i in $(seq 1 15); do
            if kubectl -n staging logs -l app=broadcaster --tail=50 2>/dev/null | grep -q "\[LOG_ONLY\]"; then
              ok=1; break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::staging broadcaster did not log in LOG_ONLY mode"
            kubectl -n staging logs -l app=broadcaster --tail=30 || true
            exit 1
          fi
          echo "✅ staging broadcaster logged the message in LOG_ONLY mode"
          kubectl -n staging logs -l app=broadcaster --tail=5 | grep "\[LOG_ONLY\]" || true

      # ─── Phase 2: deploy production (direct apply, bypassing Argo) ────────────
      # Production normally deploys via Argo on tag push. In CI we can't create
      # a real tag, so we use FORCE_DIRECT_APPLY=1 which still sets up all
      # production secrets + the backup-config ConfigMap, then applies
      # gitops/production directly.
      - name: Deploy production (direct apply)
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          GITOPS_REPO_URL: https://github.com/${{ github.repository }}.git
          FORCE_DIRECT_APPLY: "1"
          TARGET_NS: production
          TARGET_TAG: main
        run: |
          chmod +x deploy-gke.sh
          ./deploy-gke.sh

      - name: Assert production — backup resources exist
        run: |
          set -euo pipefail
          kubectl -n production get cronjob backup-todo-db-cronjob >/dev/null
          kubectl -n production get secret  storage-sa-key         >/dev/null
          kubectl -n production get configmap backup-config        >/dev/null
          echo "✅ production backup CronJob + secret + configmap all present"

      - name: Trigger production backup CronJob and verify upload
        run: |
          set -euo pipefail
          JOB="backup-test-${GITHUB_RUN_ID}"
          kubectl -n production create job --from=cronjob/backup-todo-db-cronjob "${JOB}"

          for i in $(seq 1 100); do
            complete=$(kubectl -n production get job "${JOB}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl -n production get job "${JOB}"   -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}'   2>/dev/null || true)
            if [ "$complete" = "True" ]; then echo "✅ backup job completed"; break; fi
            if [ "$failed"   = "True" ]; then
              echo "::error::backup job failed"
              kubectl -n production describe job "${JOB}" || true
              kubectl -n production logs -l job-name="${JOB}" --all-containers --tail=200 || true
              exit 1
            fi
            sleep 3
            if [ "$i" -eq 100 ]; then
              echo "::error::backup job timed out"
              kubectl -n production describe job "${JOB}" || true
              kubectl -n production logs -l job-name="${JOB}" --all-containers --tail=200 || true
              exit 1
            fi
          done

          BUCKET=$(kubectl -n production get configmap backup-config -o jsonpath='{.data.BACKUP_BUCKET}')
          if [ -z "${BUCKET}" ]; then
            echo "::error::BACKUP_BUCKET not found in production backup-config ConfigMap"
            kubectl -n production get configmap backup-config -o yaml || true
            exit 1
          fi
          echo "▶ checking emulator bucket gs://${BUCKET}"
          COUNT=$(curl -fsS "http://localhost:4588/storage/v1/b/${BUCKET}/o" \
                    | python3 -c 'import sys,json; d=json.load(sys.stdin); print(len(d.get("items",[])))')
          [ "${COUNT}" -ge 1 ] || { echo "::error::backup file not found in gs://${BUCKET}"; exit 1; }
          echo "✅ ${COUNT} object(s) present in gs://${BUCKET}"

      - name: Assert production — public HTTPRoutes work
        run: |
          set -euo pipefail
          if ! curl -fsS --max-time 2 "http://localhost:${GATEWAY_PORT}/pingpong" >/dev/null 2>&1; then
            ENVOY_SVC=$(kubectl -n envoy-gateway-system get svc \
              -l gateway.envoyproxy.io/owning-gateway-name=exercises-gateway \
              -o jsonpath='{.items[0].metadata.name}')
            pkill -f "kubectl.*port-forward.*${ENVOY_SVC}" 2>/dev/null || true
            sleep 1
            nohup kubectl -n envoy-gateway-system port-forward svc/"${ENVOY_SVC}" "${GATEWAY_PORT}:80" \
              >/tmp/envoy-test-pf.log 2>&1 &
            for i in $(seq 1 20); do
              curl -fsS --max-time 2 "http://localhost:${GATEWAY_PORT}/pingpong" >/dev/null 2>&1 && break
              sleep 1
            done
          fi
          BASE="http://localhost:${GATEWAY_PORT}"
          fail=0
          check() { curl -fsS --max-time 10 "$2" | grep -q -- "$3" || { echo "::error::$1 failed"; fail=1; }; }

          for i in $(seq 1 30); do
            curl -fsS "${BASE}/" >/dev/null 2>&1 && break
            sleep 2
          done

          check "todo-app"   "${BASE}/"         "Todo App"

          TODO="ci-prod-$(date +%s)"
          curl -fsS -X POST --data-urlencode "todo=${TODO}" "${BASE}/submit" >/dev/null
          curl -fsS "${BASE}/backend" | grep -q "$TODO" \
            || { echo "::error::production todo round-trip failed"; fail=1; }

          exit $fail

      - name: Deploy counting sink in production
        run: |
          set -euo pipefail
          kubectl -n production apply -f - <<'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: sink-script
            namespace: production
          data:
            server.py: |
              from http.server import HTTPServer, BaseHTTPRequestHandler
              class H(BaseHTTPRequestHandler):
                  def do_POST(self):
                      length = int(self.headers.get('Content-Length', 0))
                      self.rfile.read(length)
                      print('RECEIVED', flush=True)
                      self.send_response(200)
                      self.send_header('Content-Length', '0')
                      self.end_headers()
                  def log_message(self, *a): pass
              HTTPServer(('0.0.0.0', 80), H).serve_forever()
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: sink
            namespace: production
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: sink
            template:
              metadata:
                labels:
                  app: sink
              spec:
                containers:
                  - name: sink
                    image: python:3.12-alpine
                    command: ["python3", "/scripts/server.py"]
                    volumeMounts:
                      - name: scripts
                        mountPath: /scripts
                volumes:
                  - name: scripts
                    configMap:
                      name: sink-script
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: sink
            namespace: production
          spec:
            selector:
              app: sink
            ports:
              - port: 80
                targetPort: 80
          EOF
          kubectl -n production rollout status deployment/sink --timeout=120s

      - name: Assert production broadcaster sends exactly one message per todo (6 replicas)
        run: |
          set -euo pipefail

          if ! curl -fsS --max-time 2 "http://localhost:${GATEWAY_PORT}/pingpong" >/dev/null 2>&1; then
            ENVOY_SVC=$(kubectl -n envoy-gateway-system get svc \
              -l gateway.envoyproxy.io/owning-gateway-name=exercises-gateway \
              -o jsonpath='{.items[0].metadata.name}')
            pkill -f "kubectl.*port-forward.*${ENVOY_SVC}" 2>/dev/null || true
            sleep 1
            nohup kubectl -n envoy-gateway-system port-forward svc/"${ENVOY_SVC}" "${GATEWAY_PORT}:80" \
              >/tmp/envoy-test-pf.log 2>&1 &
            for i in $(seq 1 20); do
              curl -fsS --max-time 2 "http://localhost:${GATEWAY_PORT}/pingpong" >/dev/null 2>&1 && break
              sleep 1
            done
          fi

          # Point production broadcaster at the sink for this test only
          kubectl -n production create secret generic broadcaster-webhook \
            --from-literal=url=http://sink.production.svc.cluster.local/ \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n production delete pod -l app=broadcaster
          kubectl -n production rollout status deployment/broadcaster --timeout=180s

          # Wait for exactly 6 Ready replicas
          running=0
          for i in $(seq 1 30); do
            running=$(kubectl -n production get pods -l app=broadcaster --no-headers 2>/dev/null \
              | awk '$2=="1/1" && $3=="Running"{c++} END{print c+0}' || true)
            [ "${running:-0}" -eq 6 ] && break
            sleep 1
          done
          if [ "${running:-0}" -ne 6 ]; then
            echo "::error::expected 6 running broadcaster replicas, got ${running:-0}"
            kubectl -n production get pods -l app=broadcaster -o wide || true
            exit 1
          fi
          echo "✅ 6 broadcaster replicas running"

          PREFIX="dup-$(date +%s)"
          for i in $(seq 1 10); do
            curl -fsS -X POST --data-urlencode "todo=${PREFIX}-${i}" \
              "http://localhost:${GATEWAY_PORT}/submit" >/dev/null
          done
          echo "▶ fired 10 todos, waiting for webhook delivery..."

          n=0
          for i in $(seq 1 30); do
            n=$(kubectl -n production logs -l app=sink --tail=5000 2>/dev/null | grep -c RECEIVED || true)
            echo "  attempt $i: ${n}/10 POSTs received"
            [ "${n:-0}" -eq 10 ] && break
            sleep 1
          done

          if [ "${n:-0}" -ne 10 ]; then
            echo "::error::expected exactly 10 POSTs, got ${n:-0}"
            kubectl -n production get pods -l app=broadcaster -o wide || true
            kubectl -n production logs -l app=broadcaster --tail=50 --prefix || true
            kubectl -n production logs -l app=sink --tail=50 || true
            exit 1
          fi
          echo "::notice::broadcaster delivered exactly 10/10 messages across 6 replicas — no duplicates"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker logs floci-gcp --tail 200 || true
          cat /tmp/envoy-port-forward.log 2>/dev/null || true
          cat /tmp/envoy-test-pf.log 2>/dev/null || true
          if [ -f "$HOME/.kube/config" ]; then
            kubectl get pods -A || true
            kubectl -n exercises  describe pods || true
            kubectl -n staging    describe pods || true
            kubectl -n production describe pods || true
            kubectl -n staging    logs -l app=broadcaster --tail=50 --prefix || true
            kubectl -n production logs -l app=broadcaster --tail=50 --prefix || true
            kubectl -n production logs -l app=sink        --tail=50          || true
            kubectl -n production logs -l job-name        --tail=50 --prefix || true
                        echo "=== pingpong ksvc ==="
            kubectl -n exercises get ksvc pingpong -o yaml || true
            kubectl -n exercises describe ksvc pingpong || true

            echo "=== pingpong pod logs (app + queue-proxy) ==="
            kubectl -n exercises logs \
              -l serving.knative.dev/service=pingpong \
              --all-containers --tail=200 --prefix || true

            echo "=== knative activator logs ==="
            kubectl -n knative-serving logs -l app=activator --tail=100 --prefix || true

            echo "=== kourier logs ==="
            kubectl -n kourier-system logs -l app=3scale-kourier-gateway --tail=100 --prefix || true

            echo "=== envoy data-plane logs ==="
            kubectl -n envoy-gateway-system logs \
              -l gateway.envoyproxy.io/owning-gateway-name=exercises-gateway \
              --tail=100 --prefix || true

            echo "=== envoy-gateway controller logs ==="
            kubectl -n envoy-gateway-system logs \
              -l control-plane=envoy-gateway --tail=100 --prefix || true

            echo "=== envoy data-plane access/error logs ==="
            # Envoy Gateway's proxy container is called 'envoy'.
            kubectl -n envoy-gateway-system logs \
              -l gateway.envoyproxy.io/owning-gateway-name=exercises-gateway \
              -c envoy --tail=300 2>&1 \
              | grep -Ei 'error|500|direct_response|no_route|via_upstream|response_code' \
              | tail -50 || true
              
            echo "=== httproute ==="
            kubectl -n exercises get httproute pingpong-route -o yaml || true

          fi