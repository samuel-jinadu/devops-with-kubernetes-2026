apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      volumes:
        - name: todo-backend-data           # PVC: cross-pod share with ping-pong and log output
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: todo-backend
          image: ghcr.io/samuel-jinadu/todo-backend:main
          volumeMounts:
            - name: todo-backend-data
              mountPath: /files
          env:
            - name: PORT
              value: "8090"
            - name: TODOAPP_ROUTE
              value: /