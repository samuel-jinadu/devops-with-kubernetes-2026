apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-deployment
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: ghcr.io/samuel-jinadu/todo-backend:main
          env:
            - name: PORT
              value: "8090"
            - name: TODOAPP_ROUTE
              value: /