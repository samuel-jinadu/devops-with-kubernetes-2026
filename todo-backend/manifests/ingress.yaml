apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-backend-ingress
  namespace: project
spec:
  rules:
  - http:
      paths:
      - path: /submit
        pathType: Prefix
        backend:
          service:
            name: todo-backend-service-cluster-ip
            port:
              number: 2345
      - path: /backend
        pathType: Prefix
        backend:
          service:
            name: todo-backend-service-cluster-ip
            port:
              number: 2345