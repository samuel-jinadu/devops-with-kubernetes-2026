apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pingpong-route
  namespace: exercises
spec:
  parentRefs:
    - name: exercises-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            # __PINGPONG_HOST__ is substituted by deploy-gke.sh with the
            # ksvc's actual sslip.io hostname (e.g.
            # pingpong.exercises.10.0.0.1.sslip.io). Using the cluster-local
            # name here causes the Knative activator to reject the request
            # with 500 — it only accepts Hosts registered in the ksvc's
            # public URL.
            hostname: __PINGPONG_HOST__
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: pingpong
          port: 80