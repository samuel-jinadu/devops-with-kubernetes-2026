apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pingpong-route
  namespace: exercises
spec:
  parentRefs:
    - name: exercises-gateway
  # "localhost"      → matches Host: localhost:8060 (CI port-forward path)
  # "*.sslip.io"     → matches Host: pingpong.exercises.<ip>.sslip.io
  # NOTE: a bare "*" is NOT a valid Gateway API hostname — the schema
  # requires at least one label after "*.". "localhost" has no dot and
  # therefore has to be listed separately.
  hostnames:
    - localhost
    - "*.sslip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            # __PINGPONG_HOST__ is substituted by deploy-gke.sh with the
            # ksvc's actual sslip.io hostname. The activator / queue-proxy
            # chain expects Host to be the ksvc's registered hostname, not
            # the incoming one.
            hostname: __PINGPONG_HOST__
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: pingpong        # ClusterIP Service created by the ksvc
          port: 80              # ksvc listens on :80, queue-proxy rewrites to :8080