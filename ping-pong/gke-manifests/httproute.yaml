apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pingpong-route
  namespace: exercises
spec:
  parentRefs:
    - name: exercises-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      filters:
        - type: URLRewrite
          urlRewrite:
            # Knative (Kourier / activator) routes by Host header. This must
            # match the ksvc's cluster-local DNS name.
            hostname: pingpong.exercises.svc.cluster.local
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: pingpong        # ClusterIP Service created by the Knative Service
          port: 80              # Knative listens on 80; queue-proxy rewrites to 9090