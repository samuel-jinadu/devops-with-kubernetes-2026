apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pingpong
  namespace: exercises
spec:
  template:
    # Pod-template annotations belong here, NOT on the ksvc's top-level
    # metadata.annotations. Knative only reads autoscaling.* from this spot.
    metadata:
      annotations:
        # Keep one replica warm so log-output's 2-second /readyz timeout never
        # fails on a cold start. Set to "0" (or remove) for true scale-to-zero.
        autoscaling.knative.dev/min-scale: "1"
    spec:
      containers:
        - name: pingpong
          image: ghcr.io/samuel-jinadu/ping-pong-app:main
          # 9090 is reserved by Knative (used by autoscaler). Use 8080.
          # Knative injects PORT=8080 into the container env, which the app
          # reads via os.Getenv("PORT") — so do NOT set PORT yourself.
          ports:
            - containerPort: 8080
          env:
            # NOTE: no PORT entry — Knative owns it.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dbname
            - name: POSTGRES_HOST
              value: postgres-svc.exercises.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"