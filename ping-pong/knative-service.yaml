apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pingpong
  namespace: exercises
  annotations:
    # Keep one replica warm so log-output's 2-second /readyz timeout never
    # fails on a cold start. Remove / set to "0" to allow true scale-to-zero.
    autoscaling.knative.dev/min-scale: "1"
spec:
  template:
    spec:
      containers:
        - name: pingpong
          image: ghcr.io/samuel-jinadu/ping-pong-app:main
          ports:
            - containerPort: 9090
          env:
            - name: PORT
              value: "9090"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dbname
            - name: POSTGRES_HOST
              value: postgres-svc.exercises.svc.cluster.local
            - name: POSTGRES_PORT
              value: "5432"