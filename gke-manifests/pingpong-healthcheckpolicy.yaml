apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: pingpong-health-check
  namespace: exercises
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        port: 9090
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: pingpong-service-cluster-ip