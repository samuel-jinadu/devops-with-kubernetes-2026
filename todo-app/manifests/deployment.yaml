apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-deployment
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: pingpong-data           # PVC: cross-pod share with ping-pong and log output
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: todo-app
          image: ghcr.io/samuel-jinadu/todo-app:main
          volumeMounts:
            - name: pingpong-data
              mountPath: /files
          envFrom:
            - configMapRef:
                name: todo-app-configmap