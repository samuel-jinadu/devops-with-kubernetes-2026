apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      volumes:                          # ← pod-level, declared once
        - name: shared-files
          emptyDir: {}
      containers:
        - name: hashgenerator-a
          image: ghcr.io/samuel-jinadu/log-output:main
          volumeMounts:
            - name: shared-files
              mountPath: /files
          env:
            - name: FILEPATH
              value: /files/data.json
            - name: WHICH
              value: Generator
        - name: hashgenerator-b
          image: ghcr.io/samuel-jinadu/log-output:main
          volumeMounts:
            - name: shared-files
              mountPath: /files
          env:
            - name: PORT
              value: "9090"
            - name: FILEPATH
              value: /files/data.json
            - name: WHICH
              value: Reader