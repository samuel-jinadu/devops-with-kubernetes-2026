grafana:
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100
      isDefault: false
      editable: true
      jsonData:
        maxLines: 1000
        httpHeaderName1: X-Scope-OrgID  
      secureJsonData:
        httpHeaderValue1: "1"         

# ─── Emulator-friendly overrides ───
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false