apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../base

patches:
  # Broadcaster runs in log-only mode: LOG_ONLY=true short-circuits the POST.
  # GENERIC_WEBHOOK_URL is optional (see base deployment), so its secret can
  # be missing in staging.
  - target:
      kind: Deployment
      name: broadcaster
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: broadcaster
      spec:
        template:
          spec:
            containers:
              - name: broadcaster
                env:
                  - name: LOG_ONLY
                    value: "true"