apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
  namespace: project
spec:
  replicas: 6
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: ghcr.io/samuel-jinadu/broadcaster:main
          env:
            - name: NATS_URL
              value: nats://nats.exercises.svc.cluster.local:4222
            - name: GENERIC_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: broadcaster-webhook
                  key: url