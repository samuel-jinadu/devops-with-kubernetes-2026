apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # __GITOPS_REPO_URL__ is substituted by deploy-gke.sh (works in forks too).
    repoURL: '__GITOPS_REPO_URL__'
    # Exercise 4.8: only the main branch is deployed to the cluster.
    targetRevision: main
    path: gitops/project
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true