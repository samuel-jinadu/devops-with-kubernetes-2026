apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-todo-db-cronjob
  namespace: project
spec:
  schedule: "0 3 * * *"   # daily at 03:00 UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: gcr.io/google.com/cloudsdktool/cloud-sdk:alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  apk add --no-cache postgresql-client >/dev/null
                  TS=$(date +%Y%m%d-%H%M%S)
                  FILE="/tmp/todos-${TS}.sql"
                  echo "▶ pg_dump → ${FILE}"
                  pg_dump -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f "$FILE"

                  if [ -n "$STORAGE_EMULATOR_HOST" ]; then
                    # ── Emulator: upload via GCS JSON API with curl (no auth, no gsutil)
                    echo "▶ curl upload → ${STORAGE_EMULATOR_HOST}/upload/storage/v1/b/${BACKUP_BUCKET}/o"
                    curl -fsS -X POST \
                      "${STORAGE_EMULATOR_HOST}/upload/storage/v1/b/${BACKUP_BUCKET}/o?uploadType=media&name=todos-${TS}.sql" \
                      -H "Content-Type: application/octet-stream" \
                      --data-binary "@${FILE}" >/dev/null
                  else
                    # ── Real GKE: gsutil to real GCS with the mounted SA key
                    echo "▶ gsutil cp → gs://${BACKUP_BUCKET}/todos-${TS}.sql"
                    gsutil cp "$FILE" "gs://${BACKUP_BUCKET}/todos-${TS}.sql"
                  fi

                  echo "✅ backup complete"
              env:
                - name: POSTGRES_HOST
                  value: postgres-svc.exercises.svc.cluster.local
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: dbname
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-credentials
                      key: password
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /etc/gcp/key.json
                - name: BACKUP_BUCKET
                  value: BACKUP_BUCKET_PLACEHOLDER
                # STORAGE_EMULATOR_HOST_BLOCK_START
                - name: STORAGE_EMULATOR_HOST
                  value: "STORAGE_EMULATOR_HOST_PLACEHOLDER"
                # STORAGE_EMULATOR_HOST_BLOCK_END
              volumeMounts:
                - name: gcp-key
                  mountPath: /etc/gcp
                  readOnly: true
          volumes:
            - name: gcp-key
              secret:
                secretName: storage-sa-key